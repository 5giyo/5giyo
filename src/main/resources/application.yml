#server:
#  port: ${PORT}

spring:
  application:
    name: ogiyo

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      password: ${REDIS_PASSWORD:1234}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-idle: 5
          min-idle: 2
          max-active: 5


jwt:
  secret:
    key: ${JWT_KEY}



cloud:
  aws:
    region:
      static: us-east-2
    s3:
      bucket: ogiyo-bucket
      path:
        review: "review/"
    credentials:
      accessKey: ${S3_ACCESS_KEY}
      secretKey: ${S3_SECRET_KEY}
    stack:
      auto: false
