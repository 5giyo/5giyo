#server:
#  port: ${PORT}

spring:
  application:
    name: Ogiyo

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      password: ${REDIS_PASSWORD:1234}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6369}
      lettuce:
        pool:
          max-idle: 5
          min-idle: 2
          max-active: 5


jwt:
  secret:
    key: ${JWT_KEY}


